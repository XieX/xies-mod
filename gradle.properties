org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# --- Mod identity ---------------------------------------------------------
mod_id=xiesmod
mod_name=Xie's Mod
mod_license=MIT
mod_version=0.5.0
mod_group_id=mod.xie.xm
mod_authors=Xie
mod_description=Runtime content engine for Minecraft. Define blocks, items and \
  recipes in plain text files.

# --- Platform -------------------------------------------------------------
# 26.3 is the newest line with a stable NeoForge; 26.4 is still in snapshots.
# Bump these three together.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.101

# Minecraft ships Gson on the classpath, so the mod jar does not bundle it.
# Keep this aligned with the version Minecraft bundles for the target version.
gson_version=2.14.0
junit_version=5.11.4
