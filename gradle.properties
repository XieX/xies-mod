org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# --- Mod identity ---------------------------------------------------------
mod_id=xiesmod
mod_name=Xie's Mod
mod_license=MIT
mod_version=0.4.0
mod_group_id=mod.xie.xm
mod_authors=Xie
mod_description=Runtime content engine for Minecraft. Define blocks, items and \
  recipes in plain text files.

# --- Platform -------------------------------------------------------------
# NeoForge for 26.2 is still beta (26.2.0.50-beta at time of writing), so we
# target the current stable line. Bump these two together when 26.2 stabilises.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.94

# Minecraft ships Gson on the classpath, so the mod jar does not bundle it.
# Keep this aligned with the version Minecraft bundles for the target version.
gson_version=2.11.0
junit_version=5.11.4
